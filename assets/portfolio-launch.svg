<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Launch Louzhiyuan's personal website</title>
  <desc id="desc">A warm animated portfolio launch card showing projects, writing, and a ready-to-open personal website.</desc>
  <style>
    :root { color-scheme: light; }
    .window { fill: #fffdfa; stroke: #e7e3db; stroke-width: 2; }
    .bar { fill: #f1efe9; }
    .divider, .rule { stroke: #e7e3db; stroke-width: 1; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "PingFang SC", "Microsoft YaHei", monospace; }
    .meta { fill: #8b847b; font-size: 12px; letter-spacing: .8px; }
    .eyebrow { fill: #c2410c; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
    .headline { fill: #1f1e1c; font-size: 28px; font-weight: 800; letter-spacing: -.4px; }
    .sub { fill: #6b675f; font-size: 13px; letter-spacing: 1px; }
    .module { fill: #ffffff; stroke: #e7e3db; stroke-width: 1.5; }
    .module-id { fill: #c2410c; font-size: 12px; font-weight: 800; letter-spacing: 1px; }
    .module-title { fill: #1f1e1c; font-size: 17px; font-weight: 700; }
    .module-copy { fill: #6b675f; font-size: 12px; }
    .module-dot { fill: #c2410c; }
    .console { fill: #f8f6f1; stroke: #e7e3db; stroke-width: 1.5; }
    .prompt { fill: #c2410c; font-size: 14px; font-weight: 700; }
    .body { fill: #6b675f; font-size: 14px; }
    .ok { fill: #4b8b63; font-weight: 800; }
    .ready { fill: #c2410c; font-size: 14px; font-weight: 800; letter-spacing: 1px; }
    .cta { fill: #ffffff; font-size: 12px; font-weight: 800; letter-spacing: 1.2px; }
    .cta-bg { fill: #c2410c; }
    .pulse { fill: none; stroke: #c2410c; stroke-width: 1.5; opacity: 0; animation: pulse 8.5s ease-in-out infinite; }
    .rise { opacity: 0; animation: rise 8.5s ease-in-out infinite; }
    .m1 { animation-delay: .25s; }
    .m2 { animation-delay: .55s; }
    .m3 { animation-delay: .85s; }
    .console-in { opacity: 0; animation: consoleIn 8.5s ease-in-out infinite; animation-delay: 1.25s; }
    .l1 { animation-delay: 1.5s; }
    .l2 { animation-delay: 1.8s; }
    .l3 { animation-delay: 2.1s; }
    .cta-in { opacity: 0; animation: ctaIn 8.5s ease-in-out infinite; animation-delay: 2.35s; }
    .cursor { fill: #c2410c; animation: blink .85s steps(1) infinite; }
    @keyframes rise {
      0%, 5% { opacity: 0; transform: translateY(7px); }
      13%, 78% { opacity: 1; transform: translateY(0); }
      90%, 100% { opacity: 0; transform: translateY(-3px); }
    }
    @keyframes consoleIn {
      0%, 14% { opacity: 0; transform: translateY(7px); }
      22%, 80% { opacity: 1; transform: translateY(0); }
      91%, 100% { opacity: 0; }
    }
    @keyframes ctaIn {
      0%, 28% { opacity: 0; transform: scale(.96); }
      36%, 82% { opacity: 1; transform: scale(1); }
      92%, 100% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 32% { opacity: 0; transform: scale(.92); }
      44%, 80% { opacity: .55; transform: scale(1); }
      92%, 100% { opacity: 0; transform: scale(1.04); }
    }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .console-in, .cta-in, .pulse, .cursor { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <rect class="window" x="1" y="1" width="998" height="518" rx="24"/>
  <path class="bar" d="M25 2h950a23 23 0 0 1 23 23v32H2V25A23 23 0 0 1 25 2z"/>
  <line class="divider" x1="1" y1="57" x2="999" y2="57"/>
  <circle cx="28" cy="30" r="7" fill="#ef6461"/>
  <circle cx="51" cy="30" r="7" fill="#efbd4e"/>
  <circle cx="74" cy="30" r="7" fill="#55b96f"/>
  <text class="mono meta" x="500" y="34" text-anchor="middle">lzyhappylife / personal website — 100×30</text>

  <text class="mono eyebrow rise" x="56" y="96">PORTFOLIO SYSTEM / 01</text>
  <text class="mono headline rise" x="56" y="132">IDEAS IN → SYSTEMS OUT</text>
  <text class="mono sub rise" x="56" y="158">AI PRODUCT · AGENT ENGINEERING · BUILD LOG</text>
  <line class="rule rise" x1="56" y1="183" x2="944" y2="183"/>

  <g class="rise m1">
    <rect class="module" x="56" y="211" width="272" height="116" rx="16"/>
    <circle class="module-dot" cx="80" cy="239" r="4"/>
    <text class="mono module-id" x="94" y="243">01 / PROJECTS</text>
    <text class="mono module-title" x="80" y="278">AI product experiments</text>
    <text class="mono module-copy" x="80" y="302">Shipped as usable tools.</text>
  </g>

  <g class="rise m2">
    <rect class="module" x="364" y="211" width="272" height="116" rx="16"/>
    <circle class="module-dot" cx="388" cy="239" r="4"/>
    <text class="mono module-id" x="402" y="243">02 / WRITING</text>
    <text class="mono module-title" x="388" y="278">Notes that clarify work</text>
    <text class="mono module-copy" x="388" y="302">Think → act → review.</text>
  </g>

  <g class="rise m3">
    <rect class="module" x="672" y="211" width="272" height="116" rx="16"/>
    <circle class="module-dot" cx="696" cy="239" r="4"/>
    <text class="mono module-id" x="710" y="243">03 / ABOUT</text>
    <text class="mono module-title" x="696" y="278">Builder mode: ON</text>
    <text class="mono module-copy" x="696" y="302">Curious by default.</text>
  </g>

  <g class="console-in">
    <rect class="console" x="56" y="365" width="888" height="96" rx="16"/>
    <text class="mono prompt l1" x="80" y="397">louzhiyuan@lzy-mac ~ % <tspan class="body">open portfolio</tspan></text>
    <text class="mono body l2" x="80" y="425">[ <tspan class="ok">OK</tspan> ] loading projects, writing, and experiments<tspan class="cursor">▋</tspan></text>
    <text class="mono ready l3" x="80" y="450">PORTFOLIO READY</text>
    <g class="cta-in">
      <rect class="cta-bg" x="694" y="394" width="218" height="42" rx="21"/>
      <rect class="pulse" x="694" y="394" width="218" height="42" rx="21"/>
      <text class="mono cta" x="803" y="420" text-anchor="middle">CLICK TO LAUNCH ↗</text>
    </g>
  </g>
</svg>
